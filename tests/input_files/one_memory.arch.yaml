# One memory and one compute unit with distinct per-bit read and write energies, so
# each modeled action count can be recovered from the total energy by hand.
arch:
  nodes:
  - !Memory
    name: MainMemory
    size: inf
    leak_power: 0
    area: 0
    tensors: {keep: All}
    actions:
    - {name: read, energy: 2, throughput: inf, latency: 0}
    - {name: write, energy: 3, throughput: inf, latency: 0}

  - !Compute
    name: MAC
    leak_power: 0
    area: 0
    actions:
    - {name: compute, energy: 5, throughput: 1, latency: 1}
