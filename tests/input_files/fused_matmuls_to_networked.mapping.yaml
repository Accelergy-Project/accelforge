mapping:
  nodes:
  - !Storage
    component: MainMemory
    tensors: [I, B, WA, WB]
  - !Storage
    component: GlobalBuffer
    tensors: [WA, WB]
  - !Temporal
    rank_variable: m
    tile_shape: 1
  - !Sequential
    nodes:
    - !Nested
      nodes:
      - !Storage
        component: GlobalBuffer
        tensors: [I, A]
      - !Spatial
        rank_variable: nI
        tile_shape: {{ MAC_TILE }}
        component: Scratchpad
        name: X
      - !Storage
        component: Scratchpad
        tensors: [I, A, WA]
      - !Temporal
        rank_variable: nA
        tile_shape: 1
      - !Spatial
        rank_variable: nI
        tile_shape: 1
        component: MAC
        name: X
      - !Compute
        einsum: MatmulA
        component: MAC
    - !Nested
      nodes:
      - !Storage
        component: GlobalBuffer
        tensors: [A, B]
      - !Spatial
        rank_variable: nA
        tile_shape: {{ MAC_TILE }}
        component: Scratchpad
        name: X
      - !Storage
        component: Scratchpad
        tensors: [A, B, WB]
      - !Temporal
        rank_variable: nB
        tile_shape: 1
      - !Spatial
        rank_variable: nA
        tile_shape: 1
        component: MAC
        name: X
      - !Compute
        einsum: MatmulB
        component: MAC
