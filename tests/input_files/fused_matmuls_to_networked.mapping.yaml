mapping:
  nodes:
  - !Storage
    component: MainMemory
    tensors: [T0, T2, W0, W1]
  - !Storage
    component: GlobalBuffer
    tensors: [W0, W1]
  - !Temporal
    rank_variable: m
    tile_shape: 1
  - !Sequential
    nodes:
    - !Nested
      nodes:
      - !Storage
        component: GlobalBuffer
        tensors: [T0, T1]
      - !Spatial
        rank_variable: n0
        tile_shape: {{ MAC_TILE }}
        component: Scratchpad
        name: X
      - !Storage
        component: Scratchpad
        tensors: [T0, T1, W0]
      - !Temporal
        rank_variable: n1
        tile_shape: 1
      - !Spatial
        rank_variable: n0
        tile_shape: 1
        component: MAC
        name: X
      - !Compute
        einsum: Matmul0
        component: MAC
    - !Nested
      nodes:
      - !Storage
        component: GlobalBuffer
        tensors: [T1, T2]
      - !Spatial
        rank_variable: n1
        tile_shape: {{ MAC_TILE }}
        component: Scratchpad
        name: X
      - !Storage
        component: Scratchpad
        tensors: [T1, T2, W1]
      - !Temporal
        rank_variable: n2
        tile_shape: 1
      - !Spatial
        rank_variable: n1
        tile_shape: 1
        component: MAC
        name: X
      - !Compute
        einsum: Matmul1
        component: MAC
