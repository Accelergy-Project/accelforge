# The arch of tests/input_files/distributed_binding.arch.yaml, with the order of the
# spatial loops over the array's X dimension left open to the test to constrain.
arch:
  nodes:
  - !Memory
    name: MainMemory
    size: inf
    area: 0
    leak_power: 0
    tensors: {keep: ~Intermediates, may_keep: All}
    actions:
    - {name: read, energy: 0, throughput: inf, latency: 0}
    - {name: write, energy: 0, throughput: inf, latency: 0}

  - !Array
    name: Array
    spatial:
    - name: X
      fanout: 2
      tensor_order_options: {{ X_TENSOR_ORDER_OPTIONS | default("[]") }}
    - {name: Y, fanout: 2}
    nodes:
    - !Memory
      name: GlobalBuffer
      size: inf
      area: 0
      leak_power: 0
      tensors: {keep: ~Intermediates, may_keep: All}
      actions:
      - {name: read, energy: 0, throughput: inf, latency: 0}
      - {name: write, energy: 0, throughput: inf, latency: 0}

    - !Memory
      name: SharedBuffer
      size: 1048576
      area: 0
      leak_power: 0
      tensors: {keep: All, may_keep: All}
      actions:
      - {name: read, energy: 5, throughput: 1, latency: 0}
      - {name: write, energy: 5, throughput: inf, latency: 0}
      spatial:
      - {name: X, fanout: 2}
      - {name: Y, fanout: 2}

  - !Compute
    name: MAC
    area: 0
    leak_power: 0
    actions:
    - {name: compute, energy: 1, throughput: inf, latency: 0}
