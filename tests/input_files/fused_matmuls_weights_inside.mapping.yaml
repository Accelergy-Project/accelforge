{# Same naming convention as examples/mappings/_matmul_convention.yaml, inlined
   because Jinja only searches this file's own directory for imports. #}
{% set TENSOR_NAMES = "ABCDEFGHIJKLMNOPQRSTUVWXYZ" %}
{%- macro tensor_name(i) -%}
  {% if i == 0 %}
    {{- TENSOR_NAMES[8] -}}
  {% else %}
    {{- TENSOR_NAMES[i-1] -}}
  {% endif %}
{%- endmacro -%}

mapping:
  nodes:
  - !Storage
    tensors: [{{tensor_name(0)}}, {{tensor_name(N_EINSUMS)}}]
    component: MainMemory
  {% for i in range(N_EINSUMS) %}
  - !Storage
    tensors: [W{{tensor_name(i+1)}}]
    component: MainMemory
  {% endfor %}
  - !Temporal
    rank_variable: m
    tile_shape: 1
  - !Sequential
    nodes:
    {% for i in range(N_EINSUMS) %}
    - !Nested
      nodes:
      - !Storage
        tensors: [W{{tensor_name(i+1)}}]
        component: GlobalBuffer
      - !Storage
        tensors: [{{tensor_name(i)}}, {{tensor_name(i+1)}}]
        component: GlobalBuffer
      - !Temporal
        rank_variable: n{{tensor_name(i)}}
        tile_shape: 1
      - !Temporal
        rank_variable: n{{tensor_name(i+1)}}
        tile_shape: 1
      - !Compute
        einsum: Matmul{{tensor_name(i+1)}}
        component: MAC
    {% endfor %}
