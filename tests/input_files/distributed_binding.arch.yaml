arch:
  nodes:
  - !Memory
    name: MainMemory
    size: inf
    area: 0
    leak_power: 0
    # Intermediate tensors are backed by the SharedBuffer so that their binding to the
    # SharedBuffer's physical instances is part of the mapspace.
    tensors: {keep: ~Intermediates, may_keep: All}
    actions:
    - {name: read, energy: 0, throughput: inf, latency: 0}
    - {name: write, energy: 0, throughput: inf, latency: 0}

  - !Array
    name: Array
    spatial:
    - {name: X, fanout: 2}
    - {name: Y, fanout: 2}
    nodes:
    - !Memory
      name: GlobalBuffer
      size: inf
      area: 0
      leak_power: 0
      tensors: {keep: ~Intermediates, may_keep: All}
      actions:
      - {name: read, energy: 0, throughput: inf, latency: 0}
      - {name: write, energy: 0, throughput: inf, latency: 0}

    # Physically distributed: it has a spatial fanout of its own, so the tensor it
    # holds is spread over its physical instances by the spatial loops below it.
    - !Memory
      name: SharedBuffer
      size: 1048576
      area: 0
      leak_power: 0
      tensors: {keep: All, may_keep: All}
      actions:
      - {name: read, energy: 5, throughput: 1, latency: 0}
      - {name: write, energy: 5, throughput: inf, latency: 0}
      spatial:
      - {name: X, fanout: 2}
      - {name: Y, fanout: 2}

  - !Compute
    name: MAC
    area: 0
    leak_power: 0
    actions:
    - {name: compute, energy: 1, throughput: inf, latency: 0}
