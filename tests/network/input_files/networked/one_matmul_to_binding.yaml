mapping:
  nodes:
  - !Storage
    component: MainMemory
    tensors: [I, A, WA]

  # WA is indexed by nI and nA, so of the two spatial loops below, the X loop
  # (over m) is irrelevant to it and the Y loop (over nI) is relevant. The
  # locally-optimal binding therefore replicates WA along X and partitions it
  # along NI on Y.
  - !Storage
    component: DistributedBuffer
    tensors: [WA]

  - !Spatial
    rank_variable: m
    tile_shape: {{ M_TILE }}
    component: Array
    name: X
  - !Spatial
    rank_variable: nI
    tile_shape: {{ N_TILE }}
    component: Array
    name: Y

  - !Storage
    component: Scratchpad
    tensors: [I, A, WA]

  - !Temporal
    rank_variable: m
    tile_shape: 1
  - !Temporal
    rank_variable: nI
    tile_shape: 1
  - !Temporal
    rank_variable: nA
    tile_shape: 1
  - !Compute
    einsum: MatmulA
    component: MAC
