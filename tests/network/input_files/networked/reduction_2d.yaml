# A 2-D array whose DistributedBuffer has one physical instance per array
# coordinate, so the two spatial loops below it *are* its binding.
#
# The point of the second dimension: a spatial loop on X reduces a tile that the
# loop on Y has already spread over the Y instances, so those instances reduce
# their own slices side by side. Per-instance figures have to divide by both.
#
# Otherwise the same fixture as `reduction.yaml`: the hop action costs one unit
# of energy and no time, so the hop count is what a test measures unless it asks
# for a finite `HOP_THROUGHPUT`.
arch:
  nodes:
  - !Memory
    name: MainMemory
    size: inf
    area: 0
    leak_power: 0
    tensors: {keep: All}
    actions:
    - {name: read, energy: 0, throughput: inf}
    - {name: write, energy: 0, throughput: inf}

  - !Array
    name: Array
    spatial:
    - {name: X, fanout: {{ FANOUT_X }}}
    - {name: Y, fanout: {{ FANOUT_Y }}}
    nodes:
    - !Memory
      name: DistributedBuffer
      size: inf
      area: 0
      leak_power: 0
      tensors: {keep: All, may_keep: All}
      actions:
      - {name: read, energy: 0, throughput: {{ MEM_THROUGHPUT }}}
      - {name: write, energy: 0, throughput: {{ MEM_THROUGHPUT }}}
      spatial:
      - {name: X, fanout: {{ FANOUT_X }}}
      - {name: Y, fanout: {{ FANOUT_Y }}}

    - !Network
      name: NoC
      topology: {{ TOPOLOGY }}
      area: 0
      leak_power: 0
      actions:
      - {name: hop, energy: 1, latency: 0, throughput: {{ HOP_THROUGHPUT }}}

  - !Memory
    name: Scratchpad
    size: inf
    area: 0
    leak_power: 0
    tensors: {keep: All, may_keep: All}
    actions:
    - {name: read, energy: 0, throughput: inf}
    - {name: write, energy: 0, throughput: inf}

  - !Compute
    name: MAC
    area: 0
    leak_power: 0
    actions:
    - {name: compute, energy: 0, throughput: inf}
