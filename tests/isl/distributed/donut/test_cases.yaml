###################################################
# Donut test cases (K = 9 rings of R = 8 GPUs).    #
#                                                  #
# Node noc[l, g] is position g on ring l. Inside   #
# a ring the Ring rule holds (shortest arc, the    #
# antipode clockwise); a delivery to the next or   #
# previous ring is one direct lane. A multicast    #
# tree crosses each link once, so a ring tree      #
# costs max cw arc + max ccw arc and every lane    #
# of a tree costs 1.                               #
#                                                  #
# Expected donut_hops are HAND-DERIVED; each case  #
# lists the links so the number can be re-checked. #
#                                                  #
# donut_directed_hops is the forward-only          #
# (DirectedDonutMulticastModel) count. Case E has  #
# none: a backward delivery raises ValueError      #
# there (tested in test_donut.py).                 #
###################################################

# A. Unicast (0,0) -> (0,3): same ring, d = 3, clockwise over links 0,1,2 -> 3.
-   occ: "{ noc[l, g] -> data[c] : c = 0 and l = 0 and g = 0 }"
    fill: "{ noc[l, g] -> data[c] : c = 0 and ((l = 0 and g = 3)) }"
    dims: &2d_spatial
        -   type: Spatial
            spatial_dim: 0
            target: 0
        -   type: Spatial
            spatial_dim: 1
            target: 0
    dist_fn: &donut98 |
        {
            [noc[ld, gd] -> noc[ls, gs]] -> hops[(gd - gs) mod 8] :
                0 <= ld < 9 and 0 <= ls < 9 and 0 <= gd < 8 and 0 <= gs < 8 and
                ld = ls and 2 * ((gd - gs) mod 8) <= 8;
            [noc[ld, gd] -> noc[ls, gs]] -> hops[8 - ((gd - gs) mod 8)] :
                0 <= ld < 9 and 0 <= ls < 9 and 0 <= gd < 8 and 0 <= gs < 8 and
                ld = ls and 2 * ((gd - gs) mod 8) > 8;
            [noc[ld, gd] -> noc[ls, gs]] -> hops[(ld - ls) mod 9] :
                0 <= ld < 9 and 0 <= ls < 9 and 0 <= gd < 8 and 0 <= gs < 8 and
                ld != ls and 2 * ((ld - ls) mod 9) <= 9;
            [noc[ld, gd] -> noc[ls, gs]] -> hops[9 - ((ld - ls) mod 9)] :
                0 <= ld < 9 and 0 <= ls < 9 and 0 <= gd < 8 and 0 <= gs < 8 and
                ld != ls and 2 * ((ld - ls) mod 9) > 9
        }
    expected:
        donut_hops: 3
        donut_directed_hops: 3

# B. Antipodal unicast (0,0) -> (0,4): d = 4, the tie goes clockwise -> 4.
-   occ: "{ noc[l, g] -> data[c] : c = 0 and l = 0 and g = 0 }"
    fill: "{ noc[l, g] -> data[c] : c = 0 and ((l = 0 and g = 4)) }"
    dims: *2d_spatial
    dist_fn: *donut98
    expected:
        donut_hops: 4
        donut_directed_hops: 4

# C. Unicast (0,0) -> (0,5): d = 5 > 4, counter-clockwise over links 0,7,6 -> 3.
-   occ: "{ noc[l, g] -> data[c] : c = 0 and l = 0 and g = 0 }"
    fill: "{ noc[l, g] -> data[c] : c = 0 and ((l = 0 and g = 5)) }"
    dims: *2d_spatial
    dist_fn: *donut98
    expected:
        donut_hops: 3
        donut_directed_hops: 3

# D. Lane (0,0) -> (1,5): next ring, one forward lane -> 1.
-   occ: "{ noc[l, g] -> data[c] : c = 0 and l = 0 and g = 0 }"
    fill: "{ noc[l, g] -> data[c] : c = 0 and ((l = 1 and g = 5)) }"
    dims: *2d_spatial
    dist_fn: *donut98
    expected:
        donut_hops: 1
        donut_directed_hops: 1

# E. Backward lane (1,0) -> (0,5): previous ring, one backward lane -> 1.
-   occ: "{ noc[l, g] -> data[c] : c = 0 and l = 1 and g = 0 }"
    fill: "{ noc[l, g] -> data[c] : c = 0 and ((l = 0 and g = 5)) }"
    dims: *2d_spatial
    dist_fn: *donut98
    expected:
        donut_hops: 1

# F. Wrap (8,1) -> (0,2): ring 0 is the next ring after ring 8, one forward lane -> 1.
-   occ: "{ noc[l, g] -> data[c] : c = 0 and l = 8 and g = 1 }"
    fill: "{ noc[l, g] -> data[c] : c = 0 and ((l = 0 and g = 2)) }"
    dims: *2d_spatial
    dist_fn: *donut98
    expected:
        donut_hops: 1
        donut_directed_hops: 1

# G. Ring multicast (0,0) -> {(0,1),(0,2),(0,3)}: one clockwise arc of 3 -> 3.
-   occ: "{ noc[l, g] -> data[c] : c = 0 and l = 0 and g = 0 }"
    fill: "{ noc[l, g] -> data[c] : c = 0 and ((l = 0 and g = 1) or (l = 0 and g = 2) or (l = 0 and g = 3)) }"
    dims: *2d_spatial
    dist_fn: *donut98
    expected:
        donut_hops: 3
        donut_directed_hops: 3

# H. Ring multicast (0,0) -> {(0,2),(0,6)}: cw arc 2 plus ccw arc 2 -> 4.
-   occ: "{ noc[l, g] -> data[c] : c = 0 and l = 0 and g = 0 }"
    fill: "{ noc[l, g] -> data[c] : c = 0 and ((l = 0 and g = 2) or (l = 0 and g = 6)) }"
    dims: *2d_spatial
    dist_fn: *donut98
    expected:
        donut_hops: 4
        donut_directed_hops: 4

# I. Hub multicast (0,0) -> {(1,0),(1,3),(1,7)}: three separate lanes -> 3.
-   occ: "{ noc[l, g] -> data[c] : c = 0 and l = 0 and g = 0 }"
    fill: "{ noc[l, g] -> data[c] : c = 0 and ((l = 1 and g = 0) or (l = 1 and g = 3) or (l = 1 and g = 7)) }"
    dims: *2d_spatial
    dist_fn: *donut98
    expected:
        donut_hops: 3
        donut_directed_hops: 3

# J. Replicated source: datum at (0,0) and (0,4), wanted at (0,1) and (0,5). Each
#    destination takes its nearest copy (1 hop each) -> 2.
-   occ: "{ noc[l, g] -> data[c] : c = 0 and l = 0 and (g = 0 or g = 4) }"
    fill: "{ noc[l, g] -> data[c] : c = 0 and l = 0 and (g = 1 or g = 5) }"
    dims: *2d_spatial
    dist_fn: *donut98
    expected:
        donut_hops: 2
        donut_directed_hops: 2

# K. Self-delivery: datum at (2,3) wanted at (2,3) -> 0.
-   occ: "{ noc[l, g] -> data[c] : c = 0 and l = 2 and g = 3 }"
    fill: "{ noc[l, g] -> data[c] : c = 0 and ((l = 2 and g = 3)) }"
    dims: *2d_spatial
    dist_fn: *donut98
    expected:
        donut_hops: 0
        donut_directed_hops: 0

# L. Wrap with two sources: datum at (8,1) and (1,1), wanted at (0,2). (8,1) is
#    one forward lane away. (1,1) reaches ring 0 only over a backward lane, so on
#    the directed donut it costs 8 forward hops and (8,1) is the unique nearest
#    source; the bidirectional donut ties them at 1. Either way one lane -> 1.
-   occ: "{ noc[l, g] -> data[c] : c = 0 and ((l = 8 and g = 1) or (l = 1 and g = 1)) }"
    fill: "{ noc[l, g] -> data[c] : c = 0 and ((l = 0 and g = 2)) }"
    dims: *2d_spatial
    dist_fn: *donut98
    expected:
        donut_hops: 1
        donut_directed_hops: 1
