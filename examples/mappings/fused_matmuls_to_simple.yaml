mapping:
  nodes:
  - !Storage
    tensors:
    - T0
    - T{{N_EINSUMS}}
    {% for i in range(N_EINSUMS) %}
    - W{{i}}
    {% endfor %}
    component: MainMemory
  - !Storage
    tensors:
    {% for i in range(N_EINSUMS) %}
    - W{{i}}
    {% endfor %}
    component: GlobalBuffer
  - !Temporal
    rank_variable: m
    tile_shape: 1
  - !Storage
    tensors:
    - T0
    - T{{N_EINSUMS}}
    component: GlobalBuffer
  {% for i in range(1, N_EINSUMS) %}
  - !Storage
    tensors: [T{{i}}]
    component: GlobalBuffer
  {% endfor %}
  {% if N_EINSUMS > 1 %}
  - !Sequential
    nodes:
    {% for i in range(N_EINSUMS) %}
    - !Nested
      nodes:
      - !Temporal
        rank_variable: n{{i}}
        tile_shape: 1
      - !Temporal
        rank_variable: n{{i+1}}
        tile_shape: 1
      - !Compute
        einsum: Matmul{{i}}
        component: MAC
    {% endfor %}
  {% else %}
  - !Storage
    tensors: [T0, T1]
    component: GlobalBuffer
  - !Temporal
    rank_variable: n0
    tile_shape: 1
  - !Temporal
    rank_variable: n1
    tile_shape: 1
  - !Compute
    einsum: Matmul0
    component: MAC
  {% endif %}
